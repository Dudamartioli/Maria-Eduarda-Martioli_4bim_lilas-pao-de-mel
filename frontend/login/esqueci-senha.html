
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Configurações da página -->
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lila's - Recuperar senha</title>

    <!-- Estilo da loja -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="containerLogin">

        <section class="cartaoLogin">

            <!-- Logo da Lila's -->
            <img src="imagens/logo.png"
            alt="Logo da Lila's Pão de Mel"
            class="logoLogin">

            <h2>Esqueceu sua senha?</h2>

            <p>
                Informe seu e-mail cadastrado para
                receber um link de recuperação.
            </p>

            <!-- Formulário de recuperação -->
            <form id="formRecuperar">

                <label for="email">E-mail</label>

                <input type="email"
                       id="email"
                       placeholder="Digite seu e-mail"
                       required>

                <button type="submit">
                    Enviar link de recuperação
                </button>

            </form>

            <!-- Mensagem do sistema -->
            <p id="mensagem"></p>

            <a href="login.html">
                Voltar para o login
            </a>

        </section>

    </main>

    <script src="recuperarSenha.js"></script>

</body>

</html>
