<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fretes | Lila's</title><link rel="stylesheet" href="fretes.css"><script src="fretes.js" defer></script></head><body><header><a href="../admin.html">← Painel administrativo</a><h1>🚚 Gerenciamento de Fretes</h1><p>Campo Mourão e Goioerê: valores por bairro. Quarto Centenário e retirada: grátis.</p></header><main><section><h2 id="titulo">Cadastrar frete</h2><form id="form"><input id="id" type="hidden"><label>Cidade<select id="cidade" required><option value="">Selecione</option><option>Campo Mourão</option><option>Goioerê</option></select></label><label>Bairro<input id="bairro" required maxlength="100"></label><label>Valor (R$)<input id="valor" type="number" min="0" step="0.01" required></label><label><input id="disponivel" type="checkbox" checked> Disponível para entrega</label><button>Salvar</button><button type="button" id="limpar">Cancelar edição</button></form></section><section><h2>Bairros cadastrados</h2><p id="mensagem"></p><div class="rolagem"><table><thead><tr><th>Cidade</th><th>Bairro</th><th>Preço</th><th>Disponível</th><th>Ações</th></tr></thead><tbody id="lista"></tbody></table></div></section></main></body></html>
