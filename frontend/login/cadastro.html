
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Configurações da página -->
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lila's - Cadastro</title>

    <!-- Arquivo CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Conteúdo principal -->
    <main class="containerLogin">

        <!-- Área de cadastro -->
        <section class="cartaoLogin">

        <!-- Logo da Lila's -->
            <img src="imagens/logo.png"
            alt="Logo da Lila's Pão de Mel"
            class="logoLogin">

            <h2>Crie sua conta!</h2>

            <p>Cadastre-se para aproveitar nossos doces.</p>

            <!-- Formulário de cadastro -->
            <form id="formCadastro">

                <label for="nome">Nome completo</label>

                <input type="text"
                       id="nome"
                       placeholder="Digite seu nome"
                       required>

                <label for="email">E-mail</label>

                <input type="email"
                       id="email"
                       placeholder="Digite seu e-mail"
                       required>

                <label for="telefone">Telefone</label>

                <input type="tel"
                       id="telefone"
                       placeholder="Digite seu telefone">

                <label for="senha">Senha</label>

                <input type="password"
                       id="senha"
                       placeholder="Crie uma senha"
                       minlength="6"
                       required>

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <input type="password"
                       id="confirmarSenha"
                       placeholder="Repita sua senha"
                       minlength="6"
                       required>

                <button type="submit">
                    Criar minha conta
                </button>

            </form>

            <!-- Mensagem de retorno -->
            <p id="mensagem"></p>

            <p>
                Já possui uma conta?
                <a href="login.html">Fazer login</a>
            </p>

            <a href="../menu/menu.html">
                Voltar para a loja
            </a>

        </section>

    </main>

    <!-- Arquivo JavaScript -->
    <script src="login.js"></script>

</body>

</html>
